name: Nexus Studio 0.1.4 — Android APK Builder

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Executar testes antes de compilar"
        type: boolean
        required: true
        default: true
  push:
    branches: [main, master]
    paths:
      - "nexus-studio-0.1.4-updated-apk-builder.zip"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

concurrency:
  group: nexus-studio-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, compile and package APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and extract project archive
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="nexus-studio-0.1.4-updated-apk-builder.zip"
          if [ ! -s "$ZIP" ]; then
            echo "::error::Envie $ZIP para a raiz do repositório antes de executar o workflow."
            exit 1
          fi
          unzip -tq "$ZIP"
          mkdir -p "$RUNNER_TEMP/nexus-source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/nexus-source"
          PROJECT="$RUNNER_TEMP/nexus-source/nexus-studio"
          test -f "$PROJECT/package.json"
          test -f "$PROJECT/apps/web/package.json"
          test -f "$PROJECT/apps/android/settings.gradle.kts"
          test -f "$PROJECT/apps/android/app/build.gradle.kts"
          echo "path=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install npm dependencies
        working-directory: ${{ steps.project.outputs.path }}
        run: npm install --no-audit --no-fund

      - name: Test timeline engine
        if: ${{ github.event_name == 'push' || inputs.run_tests }}
        working-directory: ${{ steps.project.outputs.path }}
        run: npm test

      - name: Build web editor
        working-directory: ${{ steps.project.outputs.path }}
        run: npm run build

      - name: Copy web app into Android WebView assets
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/web/dist/index.html
          mkdir -p apps/android/app/src/main/assets
          rm -rf apps/android/app/src/main/assets/*
          cp -R apps/web/dist/. apps/android/app/src/main/assets/
          test -s apps/android/app/src/main/assets/index.html

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile debug APK
        working-directory: ${{ steps.project.outputs.path }}/apps/android
        run: gradle --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Verify APK and prepare checksums
        id: package
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo "::error::O build terminou sem produzir APK."; exit 1; }
          mkdir -p "$RUNNER_TEMP/nexus-release"
          cp "$APK" "$RUNNER_TEMP/nexus-release/Nexus-Studio-0.1.4-debug.apk"
          sha256sum "$RUNNER_TEMP/nexus-release/Nexus-Studio-0.1.4-debug.apk" > "$RUNNER_TEMP/nexus-release/SHA256SUMS.txt"
          APK_SIZE=$(du -h "$RUNNER_TEMP/nexus-release/Nexus-Studio-0.1.4-debug.apk" | cut -f1)
          {
            echo "## Nexus Studio 0.1.4 — resultado do build"
            echo "- APK: **gerado e verificado**"
            echo "- Tipo: debug (teste; não é uma versão assinada para Play Store)"
            echo "- Tamanho: $APK_SIZE"
            echo "- Android mínimo: API 26, conforme configuração do projeto"
            echo ""
            echo "### SHA-256"
            echo '```text'
            cat "$RUNNER_TEMP/nexus-release/SHA256SUMS.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: nexus-studio-0.1.4-android-apk
          path: |
            ${{ runner.temp }}/nexus-release/Nexus-Studio-0.1.4-debug.apk
            ${{ runner.temp }}/nexus-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
