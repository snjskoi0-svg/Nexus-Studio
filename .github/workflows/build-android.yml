name: Nexus Studio — Advanced Android APK Builder

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Executar testes do motor de timeline antes do APK"
        required: true
        type: boolean
        default: true
  push:
    branches: [main, master]
    paths:
      - "nexus-studio-0.1.2-github-apk-builder.zip"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

concurrency:
  group: nexus-studio-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="nexus-studio-0.1.2-github-apk-builder.zip"
          test -s "$ZIP" || { echo "::error::Não encontrei $ZIP na raiz do repositório."; exit 1; }
          unzip -tq "$ZIP"
          mkdir -p "$RUNNER_TEMP/nexus-source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/nexus-source"
          test -f "$RUNNER_TEMP/nexus-source/nexus-studio/package.json"
          test -f "$RUNNER_TEMP/nexus-source/nexus-studio/apps/android/settings.gradle.kts"
          echo "PROJECT_DIR=$RUNNER_TEMP/nexus-source/nexus-studio" >> "$GITHUB_ENV"

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install web dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Run timeline engine tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests || github.event_name == 'push' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm test --if-present

      - name: Build web editor
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Prepare Android WebView assets
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -d apps/web/dist
          mkdir -p apps/android/app/src/main/assets
          rm -rf apps/android/app/src/main/assets/*
          cp -R apps/web/dist/. apps/android/app/src/main/assets/
          test -s apps/android/app/src/main/assets/index.html

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gradle-8.9-bin.zip" https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Assemble Android debug APK
        working-directory: ${{ env.PROJECT_DIR }}/apps/android
        run: gradle --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Verify APK and calculate SHA-256
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo "::error::O APK não foi gerado."; exit 1; }
          mkdir -p "$RUNNER_TEMP/nexus-release"
          cp "$APK" "$RUNNER_TEMP/nexus-release/Nexus-Studio-debug.apk"
          sha256sum "$RUNNER_TEMP/nexus-release/Nexus-Studio-debug.apk" | tee "$RUNNER_TEMP/nexus-release/SHA256SUMS.txt"
          {
            echo "## Nexus Studio APK"
            echo ""
            echo "- Build: sucesso"
            echo "- Tipo: debug APK (teste)"
            echo "- Android mínimo configurado: API 26"
            echo "- Versão: 0.1.2"
            echo ""
            echo 'O APK está anexado no artefato `nexus-studio-android-apk`.'
            echo ""
            echo "SHA-256:"
            echo '```text'
            cat "$RUNNER_TEMP/nexus-release/SHA256SUMS.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: nexus-studio-android-apk
          path: |
            ${{ runner.temp }}/nexus-release/Nexus-Studio-debug.apk
            ${{ runner.temp }}/nexus-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
